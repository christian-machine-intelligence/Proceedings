<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title)$$title$ — ICMI$else$ICMI Proceedings$endif$</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ICMI Proceedings">
$if(title)$  <meta property="og:title" content="ICMI Proceedings — $title$">
$endif$
  <meta property="og:image" content="https://icmi-proceedings.com/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://icmi-proceedings.com/og-image.jpg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif;
      font-size: 19px;
      line-height: 1.7;
      color: #000;
      background: #fff;
      padding: 3rem 1.5rem;
      max-width: 42rem;
      margin: 0 auto;
    }

    a { color: #000; }
    a:hover { text-decoration: none; }

    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #000;
      text-align: center;
    }

    header .site-title {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    header .site-title a { text-decoration: none; }

    header .site-subtitle {
      font-size: 1rem;
      font-weight: 400;
      margin-top: 0.3rem;
      line-height: 1.4;
    }

    .site-nav {
      margin-top: 1.1rem;
      padding-top: 1.1rem;
      border-top: 1px solid #000;
    }
    .site-nav a {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      margin: 0 0.75rem;
      white-space: nowrap;
    }
    .site-nav a:hover { text-decoration: underline; }

    h1 { font-size: 2rem; font-weight: 700; margin: 0 0 1rem; line-height: 1.2; }
    h2 { font-size: 1.3rem; font-weight: 600; margin: 2.5rem 0 0.75rem; }
    h3 { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 0.5rem; }

    p { margin-bottom: 1rem; }

    blockquote {
      margin: 1.5rem 0;
      padding-left: 1.5rem;
      border-left: 2px solid #000;
      font-style: italic;
    }

    ul, ol { margin: 0 0 1rem; padding-left: 1.5rem; }
    li { margin-bottom: 0.35rem; }

    hr { border: none; border-top: 1px solid #ccc; margin: 2.5rem 0 1.5rem; }

    strong { font-weight: 600; }
    em { font-style: italic; }

    img {
      display: block;
      width: 100%;
      height: 360px;
      object-fit: cover;
      object-position: center;
      margin: 0.5rem 0 2rem;
    }

    footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #000;
      font-size: 0.9rem;
      text-align: center;
    }

    footer a { color: #000; }

    @media (max-width: 600px) {
      body { font-size: 17px; padding: 2rem 1rem; }
      header .site-title { font-size: 2rem; }
      h1 { font-size: 1.6rem; }
      .site-nav a { margin: 0 0.5rem; }
      img { height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="site-title"><a href="index.html">Proceedings</a></div>
    <div class="site-subtitle">of the Institute for a Christian Machine Intelligence</div>
    <nav class="site-nav">
      <a href="about.html">About</a>
      <a href="index.html">Papers</a>
      <a href="review.html">Primer</a>
      <a href="fundraising.html">Fundraising</a>
    </nav>
  </header>
  <main>
$body$
  </main>
  <footer>
    <a href="index.html">All papers</a> &middot;
    <a href="https://github.com/christian-machine-intelligence">GitHub</a>
  </footer>
</body>
</html>
