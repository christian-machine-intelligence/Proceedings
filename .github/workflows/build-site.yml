name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and texlive
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Anthropic SDK
        run: pip install --upgrade anthropic

      # Persists the generated literature review across runs, keyed on the
      # contents of the papers. The Claude API is only called when a paper is
      # added or edited; pushes that only touch the build scripts reuse the
      # cached review (a cache hit needs no API key).
      - name: Cache literature review
        uses: actions/cache@v4
        with:
          path: scripts/.review-cache.json
          key: icmi-review-${{ hashFiles('ICMI-*.md') }}
          restore-keys: |
            icmi-review-

      - name: Build site
        run: bash scripts/build-site.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
