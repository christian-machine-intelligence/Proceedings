name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRAND_DEPLOY_KEY: ${{ secrets.BRAND_DEPLOY_KEY }}
      BRAND_READ_TOKEN: ${{ secrets.BRAND_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Doves Type is licensed only for icmi-proceedings.com and is never committed to this public repo.
      # It lives in the private brand repo (fonts/web/); scripts/build-site.sh copies it into _site/fonts/.
      # Either secret gives read access: BRAND_DEPLOY_KEY, a read-only deploy key on the brand repo, or
      # BRAND_READ_TOKEN, a fine-grained token with read-only Contents on the brand repo. With neither, the
      # build fails and the live site stays as it is, rather than deploying without the type.
      - name: Fetch Doves Type from the private brand repo (deploy key)
        if: ${{ env.BRAND_DEPLOY_KEY != '' }}
        uses: actions/checkout@v4
        with:
          repository: christian-machine-intelligence/brand
          ssh-key: ${{ secrets.BRAND_DEPLOY_KEY }}
          path: .brand
          sparse-checkout: fonts/web

      - name: Fetch Doves Type from the private brand repo (token)
        if: ${{ env.BRAND_DEPLOY_KEY == '' && env.BRAND_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: christian-machine-intelligence/brand
          token: ${{ secrets.BRAND_READ_TOKEN }}
          path: .brand
          sparse-checkout: fonts/web

      - name: Install pandoc and texlive
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      # The literature review is a committed file (literature-review.md) that the
      # build only renders — no Claude API call happens here. It is refreshed
      # locally with scripts/generate-review.py and committed; the build warns
      # (non-fatally) if it has gone stale relative to the papers.
      - name: Build site
        run: bash scripts/build-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
